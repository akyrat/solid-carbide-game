<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden] { display: none !important; } body { margin: 0; } img { max-width: 100%; }</style>
<title>Solid Carbide Task Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a night-city control room. Board view = five lanes; Areas view = one bubble per game area doc. Single dark look on purpose (the game's own night palette). */
:root {
  color-scheme: dark;
  --night: #0d1029;
  --panel: #151a3d;
  --panel-2: #1c2250;
  --line: #2b3270;
  --ink: #e9eaf8;
  --muted: #9ba1cc;
  --faint: #6b71a3;
  --pink: #ff4f9a;
  --cyan: #3ee6ff;
  --todo: #8d93c4;
  --plan: #b18cff;
  --doing: #ff4f9a;
  --qa: #ffc35c;
  --done: #5fe3a6;
  --warn: #ff8a5c;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--night); color: var(--ink); }
body { font: 14px/1.45 var(--body); padding-inline: 16px; padding-block: 0 40px; min-height: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-block: 20px 14px; border-bottom: 1px solid var(--line); }
.brand small { display: block; font: 600 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); margin-bottom: 6px; }
.brand h1 { margin: 0; font: 700 26px/1.1 var(--display); letter-spacing: .02em; text-wrap: balance; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { background: none; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: var(--display); font-weight: 600; letter-spacing: .03em; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--pink); }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--pink); width: 16px; height: 16px; }
.syncline { width: 100%; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--faint); font-size: 12px; }
.syncline .pending { color: var(--qa); }

/* Board */
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-top: 18px; align-items: start; }
@media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .board { grid-template-columns: minmax(0, 1fr); } }
.lane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 160px; display: flex; flex-direction: column; transition: border-color .15s, background .15s; }
.lane.over { border-color: var(--cyan); background: #182051; }
.lane > h2 { margin: 0; padding: 12px 14px 10px; display: flex; align-items: center; gap: 8px; font: 600 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.lane > h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.lane > h2 { cursor: grab; touch-action: pan-y; user-select: none; }
.lane.col-dragging { opacity: .45; }
.lane.col-over { border-color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 16px; }
.filters .label { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-right: 4px; }
.filters button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; color: var(--muted); cursor: pointer; font: 600 12px/1 var(--display); letter-spacing: .03em; }
.filters button .n { font-family: var(--mono); color: var(--faint); margin-left: 5px; }
.filters button[aria-pressed="true"] { background: color-mix(in srgb, var(--c, var(--cyan)) 22%, var(--panel-2)); border-color: var(--c, var(--cyan)); color: var(--ink); }
.filters.owners { margin-top: 8px; }
.chip.owner { background: transparent; border: 1px solid color-mix(in srgb, var(--cyan) 55%, var(--line)); color: var(--cyan); text-transform: none; letter-spacing: .02em; }
.reset-cols { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; }
.reset-cols:hover { color: var(--ink); border-color: var(--muted); }
.reset-cols[hidden] { display: none; }
.lane > h2 .n { margin-left: auto; font-family: var(--mono); color: var(--muted); letter-spacing: 0; }
.cards { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 12px; min-height: 60px; }
.empty-lane { color: var(--faint); font-size: 12px; padding: 8px 4px; }

.card { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--todo)); border-radius: 7px; padding: 8px 10px 9px; cursor: grab; touch-action: pan-y; user-select: none; transition: transform .12s, border-color .12s; }
.card:hover { border-color: #3d468f; border-left-color: var(--c); }
.card.dragging { opacity: .35; }
.card .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card .id { font: 500 11.5px/1 var(--mono); color: var(--cyan); }
.card .title { margin-top: 5px; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { font: 600 10.5px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: #252c63; color: var(--muted); }
.chip.agent { margin-left: auto; }
.card.is-mine { border: 2px solid var(--pink); border-left-width: 4px; background: color-mix(in srgb, var(--pink) 12%, var(--panel-2)); }
.mine-label { font: 700 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--pink); margin-bottom: 7px; }
.chip.blocked { background: #3a2a4a; color: #d9a6ff; }
.chip.playtest { background: #3d3418; color: var(--qa); }
.chip.flagged { background: #47231b; color: var(--warn); }
.chip.later { background: transparent; border: 1px solid var(--line); }
.chip.cancelled { background: #2a2d45; color: var(--faint); text-decoration: line-through; }
.card.is-cancelled .title { color: var(--faint); }
.chip.moved { background: #1d3d4a; color: var(--cyan); }
.ghost { position: fixed; z-index: 50; pointer-events: none; width: 240px; transform: rotate(-2deg); box-shadow: 0 14px 30px rgba(0,0,0,.45); cursor: grabbing; }

/* Areas */
.summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 28px; align-items: center; margin-top: 22px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 600px) { .summary { grid-template-columns: minmax(0, 1fr); } }
.big { font: 700 54px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.big span { font-size: 22px; color: var(--muted); margin-left: 2px; }
.big-label { font: 600 11px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.meter { height: 8px; border-radius: 4px; background: #232a5e; overflow: hidden; margin-bottom: 10px; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--cyan)); }
.caveat { margin: 0; color: var(--muted); max-width: 70ch; font-size: 13px; }
.caveat strong { color: var(--warn); font-weight: 600; }

.bubbles { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px 26px; margin-top: 26px; padding-block: 6px; }
.bubble { --d: 150px; width: var(--d); height: var(--d); max-width: 100%; border-radius: 50%; position: relative; border: 2px solid var(--c); background: radial-gradient(circle at 35% 30%, #222a63, var(--panel) 70%); overflow: hidden; cursor: pointer; padding: 0; display: grid; place-items: center; text-align: center; transition: transform .2s, box-shadow .2s; box-shadow: 0 0 0 0 transparent, 0 0 22px -6px var(--c); }
.bubble:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 0 34px -4px var(--c); }
.bubble.none { border-style: dashed; --c: var(--warn); }
.bubble.excluded { --c: var(--faint); }
.bubble .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--p); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 45%, transparent), color-mix(in srgb, var(--c) 22%, transparent)); }
.bubble .fill::before { content: ""; position: absolute; left: -50%; width: 200%; height: 14px; top: -7px; background: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, var(--c) 45%, transparent) 60%, transparent 62%) 0 0 / 40px 14px repeat-x; animation: wave 4s linear infinite; }
@keyframes wave { to { transform: translateX(40px); } }
.bubble .txt { position: relative; padding: 10px; }
.bubble .name { font: 600 14px/1.15 var(--display); letter-spacing: .03em; text-wrap: balance; }
.bubble .pct { font: 700 22px/1.1 var(--display); margin-top: 4px; font-variant-numeric: tabular-nums; }
.bubble .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Area overlay */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(6, 8, 24, .82); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.area-panel { width: min(980px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 22px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; }
@media (max-width: 760px) { .area-panel { grid-template-columns: minmax(0, 1fr); } }
.area-head { grid-column: 1 / -1; display: flex; align-items: start; gap: 12px; }
.area-head h2 { margin: 0; font: 700 22px/1.15 var(--display); }
.area-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.close { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.sphere { position: relative; width: min(100%, 520px); aspect-ratio: 1; max-width: 100%; justify-self: center; border-radius: 50%; border: 2px solid var(--c); background: radial-gradient(circle at 35% 30%, #232b66, #12163a 72%); overflow: hidden; box-shadow: 0 0 50px -10px var(--c); }
.sphere .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--p); background: color-mix(in srgb, var(--c) 16%, transparent); border-top: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.sphere .nothing { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 18%; color: var(--muted); }
.floater { position: absolute; transform: translate(-50%, -50%); animation: bob var(--t) ease-in-out var(--delay) infinite alternate; }
.floater button { display: block; max-width: 150px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 5px 8px; cursor: pointer; text-align: left; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.floater .id { font: 500 11px/1 var(--mono); color: var(--cyan); }
.floater .t { display: block; font-size: 11.5px; line-height: 1.25; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes bob { from { translate: 0 -5px; } to { translate: 4px 6px; } }
.side h3 { margin: 4px 0 8px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.side ul { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
.side li { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; }
.side li .id { font: 500 11px/1 var(--mono); color: var(--cyan); flex: none; }
.side li .s { margin-left: auto; flex: none; font-size: 11px; color: var(--c); }
.counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
.counts div { background: var(--panel-2); border-radius: 6px; padding: 7px 8px; text-align: center; }
.counts b { display: block; font: 700 18px/1 var(--display); color: var(--c); }
.counts small { font-size: 10.5px; color: var(--muted); }

/* Highlight: changed since the board last opened the ticket */
.card.is-new { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 14px rgba(62, 230, 255, .55); }
.card.is-new:hover { border-color: var(--cyan); }
.chip.new { background: var(--cyan); color: #06112a; }

/* Ticket detail */
.lead-box { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; display: grid; gap: 8px; }
.lead-box h3 { margin: 0; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.upd-meta { font: 500 12px/1.3 var(--mono); color: var(--muted); }
.upd-meta b { color: var(--ink); font-weight: 600; }
.lead-box details.earlier { border-top: 1px solid var(--line); padding-top: 8px; }
.lead-box details.earlier summary { cursor: pointer; color: var(--muted); font: 600 12px/1.4 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.lead-box .upd { padding: 8px 0 0; }
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; width: min(720px, calc(100% - 32px)); max-height: calc(100% - 48px); overflow-y: auto; }
.review { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c, var(--qa)); border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; display: grid; gap: 10px; }
.review h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.review h3 .chip { margin-left: auto; color: var(--c, var(--qa)); }
.review .ask { margin: 0; font-size: 14px; line-height: 1.5; }
.review .ask.quiet { color: var(--muted); font-size: 13px; }
.paths { display: grid; gap: 6px; }
.path { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; }
.path .label { color: var(--muted); }
.path code { font-family: var(--mono); color: var(--cyan); overflow-wrap: anywhere; }
.path button { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer; font-size: 11.5px; }
details.notes { border-top: 1px solid var(--line); padding-top: 8px; }
details.notes summary { cursor: pointer; color: var(--muted); font: 600 12px/1.4 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.notes-body { font-size: 13px; line-height: 1.5; overflow-x: auto; }
.notes-body table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
.notes-body th, .notes-body td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.notes-body th { background: var(--panel); }
.notes-body code { font-family: var(--mono); font-size: 12px; color: var(--cyan); }
.notes-body pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
.notes-body h3, .notes-body h4 { font: 600 14px/1.3 var(--display); margin: 12px 0 4px; }
dialog::backdrop { background: rgba(6, 8, 24, .7); }
dialog h2 { margin: 6px 0 12px; font: 600 18px/1.25 var(--display); text-wrap: balance; }
dialog dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0 0 16px; font-size: 13px; }
dialog dt { color: var(--muted); }
dialog dd { margin: 0; overflow-wrap: anywhere; }
dialog .file { font-family: var(--mono); font-size: 12px; color: var(--cyan); }
.moveto { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.moveto button { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.moveto button[disabled] { opacity: .45; cursor: default; }
.note { color: var(--faint); font-size: 12px; margin: 0; }
.notefield { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: end; margin-bottom: 10px; }
.notefield label { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.notefield textarea { width: 100%; min-width: 0; resize: vertical; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 13px/1.4 var(--body); }
.cancel-task { background: #47231b; color: var(--warn); border: 1px solid #6a3324; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.syncline .live { color: var(--done); }
.syncline .down { color: var(--warn); }
.dialog-actions { display: flex; justify-content: flex-end; margin-top: 12px; }

/* Overview strip */
.overview { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
@media (max-width: 900px) { .overview { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--c); border-radius: 9px; padding: 10px 12px 11px; cursor: pointer; display: grid; gap: 4px; min-width: 0; transition: border-color .15s, background .15s; }
.tile:hover { background: var(--panel-2); border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
.tile.is-hot { background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
.tile .k { font: 600 11px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile .v { font: 700 30px/1 var(--display); color: var(--c); font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 15px; color: var(--muted); margin-left: 3px; }
.tile .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .meter { margin: 3px 0 0; height: 5px; }
.loadrow { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--muted); }
.loadrow .lbl { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.load { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--muted); }
.load:hover b { color: var(--ink); }
.load b { font: 600 12px/1 var(--display); color: var(--ink); letter-spacing: .03em; }
.load .bar { display: inline-flex; height: 6px; border-radius: 3px; overflow: hidden; background: #232a5e; }
.load .bar i { display: block; height: 100%; }
.load .n { font-family: var(--mono); font-size: 11px; }

/* Inbox */
.inbox { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 16px; margin-top: 18px; align-items: start; }
@media (max-width: 760px) { .inbox { grid-template-columns: minmax(0, 1fr); } }
.folders { display: grid; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
@media (max-width: 760px) { .folders { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); } }
.folders button { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer; color: var(--muted); }
.folders button:hover { background: var(--panel-2); color: var(--ink); }
.folders button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 3px 0 0 var(--c, var(--pink)); }
.folders .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.folders .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; }
.inbox-main { min-width: 0; display: grid; gap: 10px; }
.inbox-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.inbox-head h2 { margin: 0; font: 700 18px/1.2 var(--display); letter-spacing: .02em; }
.inbox-head p { margin: 0; color: var(--muted); font-size: 12.5px; flex: 1 1 260px; }
.inbox-head button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
.rows { display: grid; gap: 6px; }
.irow { display: grid; grid-template-columns: 10px 62px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
.irow:hover { background: var(--panel-2); }
.irow .unread { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: transparent; }
.irow.is-unread .unread { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
.irow.is-unread .t { font-weight: 600; }
.irow .id { font: 500 12px/1.5 var(--mono); color: var(--cyan); }
.irow .t { font-size: 13.5px; line-height: 1.35; }
.irow .why { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
.irow .why b { color: var(--ink); font-weight: 500; }
.irow .tags { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; }

.builds { display: grid; gap: 10px; margin-top: 16px; }

.notice { margin-top: 24px; padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); text-align: center; }
/* Screenshots and recordings (T-201) */
.chip.shot-count { background: #1d2f4a; color: #9fd8ff; }
.media { background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; display: grid; gap: 10px; }
.media h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.media h3 .n { margin-left: auto; font-family: var(--mono); letter-spacing: 0; color: var(--faint); }

.shot .frame:hover { border-color: var(--cyan); }
.shot img, .shot video { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; }
.shot video { cursor: default; background: #080a1c; border: 1px solid var(--line); border-radius: 6px; aspect-ratio: 4 / 3; }
.shot figcaption { font: 500 11px/1.3 var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot figcaption .k { color: var(--faint); }
dialog.lightbox { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0; padding: 16px; border: 0; border-radius: 0; background: #04050d; display: none; place-items: center; cursor: zoom-out; overflow: auto; }
dialog.lightbox[open] { display: grid; }
dialog.lightbox::backdrop { background: #04050d; }
dialog.lightbox img { image-rendering: pixelated; max-width: none; display: block; }
dialog.lightbox p { margin: 10px 0 0; text-align: center; font: 500 12px/1.4 var(--mono); color: var(--muted); }
/* Goals (T-202): the goal runner's goals above the lanes, and their detail */
.goals { display: grid; gap: 8px; margin-top: 16px; }
.goals-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.goals-head .label { font: 600 11px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.goals-head .fold { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; color: var(--muted); cursor: pointer; font: 600 12px/1 var(--display); letter-spacing: .03em; }
.goals-head .fold:hover { color: var(--ink); border-color: var(--muted); }

.goal:hover { background: var(--panel-2); border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
.goal.is-finished { opacity: .78; }
.goal .row { display: flex; align-items: center; gap: 6px; }
.goal .id { font: 500 11.5px/1 var(--mono); color: var(--cyan); }
.chip.gstat { color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--panel-2)); }
.goal .chip.gstat { margin-left: auto; }
.goal .gt { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.chip.goal-tag { background: transparent; border: 1px solid color-mix(in srgb, var(--plan) 55%, var(--line)); color: var(--plan); font-family: var(--mono); font-weight: 500; text-transform: none; letter-spacing: 0; }

.goal-sec h3 { margin: 0; display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.goal-sec .none { font-size: 12.5px; color: var(--muted); margin: 0; }
.goal-sec .meter { margin: 0; }
.pauses { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pauses li { display: grid; gap: 4px; font-size: 12.5px; }
.pauses .when { font: 500 12px/1.3 var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: center; }
.pauses .why { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow-y: auto; color: var(--ink); }
.pauses li.latest .when { color: var(--warn); }
.goal-file { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; }
.goal-file code { font-family: var(--mono); font-size: 12px; color: var(--cyan); overflow-wrap: anywhere; }
.goal-file a, .detail-build a { color: var(--cyan); }
.goal-build { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.goal-build button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.goal-build button[disabled] { opacity: .45; cursor: default; }
.goal-build .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-size: 13px; }

@media (prefers-reduced-motion: reduce) {
  .floater, .bubble .fill::before { animation: none; }
  .bubble, .card { transition: none; }
}

<body>

<header class="top">
  <div class="brand">
    <small>Solid Carbide · MVP</small>
    <h1>Task Board</h1>
  </div>
  <div class="controls">
    <div class="tabs" role="tablist" aria-label="View">
      <button id="tab-board" role="tab" aria-selected="true" aria-controls="view-board">Board</button>
      <button id="tab-inbox" role="tab" aria-selected="false" aria-controls="view-inbox">Inbox</button>
      <button id="tab-areas" role="tab" aria-selected="false" aria-controls="view-areas">Game areas</button>
      <button id="tab-builds" role="tab" aria-selected="false" aria-controls="view-builds">Builds</button>
    </div>
    <label class="toggle" for="mvp-only"><input type="checkbox" id="mvp-only" checked> MVP only</label>
    <button class="reset-cols" id="reset-cols" type="button" title="Put the columns back to To do, Planning, In progress, QA, Done" hidden>Reset column order</button>
  </div>
  <div class="syncline" id="syncline">Loading tickets…</div>
</header>

<main>
  <section class="overview" id="overview" aria-label="Overview"></section>
  <div class="loadrow" id="loadrow"></div>
  <section id="view-board" role="tabpanel" aria-labelledby="tab-board">
    <section class="goals" id="goals" aria-label="Goals" hidden></section>
    <div class="filters" id="filters" role="group" aria-label="Filter the board"></div>
    <div class="filters owners" id="owner-filters" role="group" aria-label="Filter the board by owner"></div>
    <div class="filters goal-filters" id="goal-filters" role="group" aria-label="Filter the board by goal"></div>
    <div class="board" id="board"></div>
  </section>
  <section id="view-inbox" role="tabpanel" aria-labelledby="tab-inbox" hidden>
    <div class="inbox">
      <nav class="folders" id="folders" aria-label="Inbox folders"></nav>
      <div class="inbox-main">
        <div class="inbox-head" id="inbox-head"></div>
        <div class="rows" id="rows"></div>
      </div>
    </div>
  </section>
  <section id="view-areas" role="tabpanel" aria-labelledby="tab-areas" hidden>
    <div class="summary" id="summary"></div>
    <div class="bubbles" id="bubbles"></div>
  </section>
  <section id="view-builds" role="tabpanel" aria-labelledby="tab-builds" hidden>
    <div class="builds" id="builds"></div>
  </section>
  <div class="notice" id="notice" hidden></div>
</main>

<div class="overlay" id="overlay" hidden></div>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="row"><span class="id" id="detail-id"></span></div>
  <h2 id="detail-title"></h2>
  <section class="lead-box" id="detail-updates" aria-label="Latest from the Project Lead" hidden></section>
  <section class="review" id="detail-review" aria-label="Your review"></section>
  <section class="media" id="detail-media" aria-label="Screenshots and recordings" hidden></section>
  <section class="detail-build" id="detail-build" aria-label="Build" hidden></section>
  <section class="deps" id="detail-deps" aria-label="Dependencies"></section>
  <dl id="detail-fields"></dl>
  <div class="moveto" id="detail-move" role="group" aria-label="Move to"></div>
  <div class="notefield">
    <label for="detail-note">Note for the move</label>
    <textarea id="detail-note" rows="2" placeholder="Needed to cancel a task or send a playtest back; added to the task's result notes"></textarea>
    <button type="button" class="cancel-task" id="detail-cancel">Cancel task</button>
  </div>
  <p class="note">A move changes the task file straight away, through the status script, so the workflow rules apply. The Project Lead hears about it at its next step.</p>
  <div class="dialog-actions"><button class="close" id="detail-close">Close</button></div>
</dialog>

<dialog id="goal-detail" aria-labelledby="goal-title">
  <div class="row"><span class="id" id="goal-id"></span></div>
  <h2 id="goal-title"></h2>
  <div id="goal-body"></div>
  <div class="dialog-actions"><button class="close" id="goal-close">Close</button></div>
</dialog>

<dialog id="lightbox" class="lightbox" aria-label="Screenshot, full size">
  <figure style="margin:0"><img id="lightbox-img" alt=""><p id="lightbox-cap"></p></figure>
</dialog>

<dialog id="movenote" aria-labelledby="move-title" style="width:min(480px, calc(100% - 32px))">
  <div class="row"><span class="id" id="move-id"></span></div>
  <h2 id="move-title"></h2>
  <p class="note" id="move-route"></p>
  <div class="notefield" style="margin-top:10px">
    <label for="move-note">Note (optional)</label>
    <textarea id="move-note" rows="3" placeholder="Goes to the ticket's owner with the move. Enter moves, Shift+Enter adds a line."></textarea>
  </div>
  <p class="note" id="move-error" role="alert" style="color:var(--warn)" hidden></p>
  <div class="dialog-actions" style="gap:8px"><button class="close" id="move-cancel" style="margin-left:0">Cancel</button><button class="close" id="move-go" style="margin-left:0">Move</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const LANES = [
  { key: "todo", name: "To do", color: "var(--todo)", statuses: ["open", "blocked"], target: "open" },
  { key: "plan", name: "Planning", color: "var(--plan)", statuses: ["planning"], target: "planning" },
  { key: "doing", name: "In progress", color: "var(--doing)", statuses: ["in-progress"], target: "in-progress" },
  { key: "qa", name: "QA", color: "var(--qa)", statuses: ["in-qa", "needs-playtest", "flagged-for-review"], target: "in-qa" },
  { key: "done", name: "Done", color: "var(--done)", statuses: ["done", "cancelled"], target: "done" },
];
// One bubble per game area doc (docs/), matched through each ticket's epic. Tooling is shown but left out of the MVP figure.
const AREAS = [
  { name: "Drifting", doc: "drifting.md", epics: ["driving"], color: "#3ee6ff" },
  { name: "Level design", doc: "level-design.md", epics: ["level-challenges"], color: "#7aa2ff" },
  { name: "Enemies", doc: "enemies.md", epics: ["enemies"], color: "#8be36b" },
  { name: "Weapons", doc: "weapons.md", epics: ["weapons"], color: "#ff4f9a" },
  { name: "Game loop", doc: "game-loop-architecture.md", epics: ["game-loop", "local-coop"], color: "#ffc35c" },
  { name: "HUD and menus", doc: "hud-and-menus.md", epics: ["hud-menus"], color: "#c58bff" },
  { name: "Garage design", doc: "garage-design.md", epics: ["garage"], color: "#ff9f5c" },
  { name: "Visual style", doc: "visual-style.md", epics: ["art"], color: "#ff6fd0" },
  { name: "Extended narrative", doc: "extended-narrative.md", epics: ["narrative"], color: "#9ff0d8" },
  { name: "Sound", doc: null, epics: ["sound"], color: "#6fd0ff" },
  { name: "Tooling", doc: null, epics: ["tooling"], color: "#8d93c4", excluded: true },
];
const AGENTS = {
  "driving-drift": "Drift", "enemy-behavior": "Enemies", "weapon-behavior": "Weapons", "game-data": "Data",
  "level-challenge": "Level", "ui": "UI", "asset-generation": "Art", "sfx": "SFX", "narrative-theme": "Narrative",
  "qa-integration": "QA", "game-loop": "Loop", "project-lead": "Lead", "board": "Board",
};
const STATUS_TEXT = {
  "open": "To do", "blocked": "Blocked", "planning": "Planning", "in-progress": "In progress", "in-qa": "In QA",
  "needs-playtest": "Needs playtest", "flagged-for-review": "Flagged for review", "done": "Done", "cancelled": "Cancelled",
};

let tickets = [];
let meta = null;
let loaded = false;
let openArea = null;
let version = null, lastRead = null, serverDown = false, seenLoaded = false;   // live data from the local server
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const laneOf = (status) => LANES.find((l) => l.statuses.includes(status)) || LANES[0];
// The board can reorder the columns by dragging their headers. Display only: kept in this browser.
const DEFAULT_ORDER = LANES.map((l) => l.key);
let colOrder = DEFAULT_ORDER;
function validOrder(keys) {
  return Array.isArray(keys) && keys.length === DEFAULT_ORDER.length && new Set(keys).size === keys.length
    && keys.every((k) => DEFAULT_ORDER.includes(k));
}
function loadColOrder() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("tbp-columns") || "null"); } catch {}
  colOrder = validOrder(stored) ? stored : DEFAULT_ORDER;
}
function saveColOrder(keys) {
  colOrder = validOrder(keys) ? keys : DEFAULT_ORDER;
  try {
    if (colOrder === DEFAULT_ORDER || colOrder.join() === DEFAULT_ORDER.join()) localStorage.removeItem("tbp-columns");
    else localStorage.setItem("tbp-columns", JSON.stringify(colOrder));
  } catch {}
}
// Filtering the board: several filters can be picked; a card shows when it matches any. Kept in this browser.
const FILTERS = [
  { key: "ready", name: "Ready", color: "var(--done)", test: (t) => readiness(t) === "ready" },
  { key: "check", name: "Can start?", color: "var(--cyan)", test: (t) => readiness(t) === "check" },
  { key: "waits", name: "Waiting", color: "#b7bcf0", test: (t) => readiness(t) === "waits" },
  { key: "blocked", name: "Blocked", color: "#d9a6ff", test: (t) => t.status === "blocked" },
  { key: "planning", name: "Planning", color: "var(--plan)", test: (t) => t.status === "planning" },
  { key: "in-progress", name: "In progress", color: "var(--doing)", test: (t) => t.status === "in-progress" },
  { key: "in-qa", name: "In QA", color: "var(--qa)", test: (t) => t.status === "in-qa" },
  { key: "needs-playtest", name: "Playtest", color: "var(--qa)", test: (t) => t.status === "needs-playtest" },
  { key: "flagged-for-review", name: "Flagged", color: "var(--warn)", test: (t) => t.status === "flagged-for-review" },
  { key: "done", name: "Done", color: "var(--done)", test: (t) => t.status === "done" },
  { key: "cancelled", name: "Cancelled", color: "var(--faint)", test: (t) => t.status === "cancelled" },
];
let picked = [];
function loadFilters() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("tbp-filters") || "null"); } catch {}
  picked = Array.isArray(stored) ? stored.filter((k) => FILTERS.some((f) => f.key === k)) : [];
}
function saveFilters() { try { localStorage.setItem("tbp-filters", JSON.stringify(picked)); } catch {} }
const passesFilter = (t) => !picked.length || FILTERS.some((f) => picked.includes(f.key) && f.test(t));
function renderFilters() {
  const list = visible();
  $("filters").innerHTML = '<span class="label">Show</span>'
    + `<button data-filter="" aria-pressed="${!picked.length}">All<span class="n">${list.length}</span></button>`
    + FILTERS.map((f) => `<button data-filter="${f.key}" style="--c:${f.color}" aria-pressed="${picked.includes(f.key)}">${f.name}<span class="n">${list.filter(f.test).length}</span></button>`).join("");
  renderOwnerFilters();
  renderGoalFilters();
}
// Filtering by owner (the ticket's lead: the Project Lead session that owns it). Works like the filters
// above: several at once, a card shows when it matches any. Together with them, a card must match both rows.
const UNOWNED = "(unowned)";   // names can't contain brackets, so this never clashes with a session's name
let ownerPicked = [];
function loadOwnerFilters() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("tbp-owners") || "null"); } catch {}
  ownerPicked = Array.isArray(stored) ? stored.filter((k) => typeof k === "string" && k) : [];
}
function saveOwnerFilters() { try { localStorage.setItem("tbp-owners", JSON.stringify(ownerPicked)); } catch {} }
const ownerKey = (t) => t.lead || UNOWNED;
const passesOwner = (t) => !ownerPicked.length || ownerPicked.includes(ownerKey(t));
function renderOwnerFilters() {
  const list = visible();
  // One button per owner on any ticket, plus any picked owner no ticket has any more, so it can be unpicked.
  const owners = [...new Set([...tickets.map((t) => t.lead).filter(Boolean), ...ownerPicked.filter((k) => k !== UNOWNED)])]
    .sort((a, b) => a.localeCompare(b));
  const button = (key, name) => `<button data-owner="${esc(key)}" aria-pressed="${ownerPicked.includes(key)}">${esc(name)}<span class="n">${list.filter((t) => ownerKey(t) === key).length}</span></button>`;
  $("owner-filters").innerHTML = '<span class="label">Owner</span>'
    + `<button data-owner="" aria-pressed="${!ownerPicked.length}">Anyone<span class="n">${list.length}</span></button>`
    + owners.map((o) => button(o, o)).join("") + button(UNOWNED, "Unowned");
}
// Filtering by goal (T-202: the ticket's `goal:` line). Works like the Owner row: several at once, "Any" clears.
const NO_GOAL = "(none)";   // goal ids are G-NNN, so this never clashes
let goalPicked = [];
function loadGoalFilters() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("tbp-goal-filter") || "null"); } catch {}
  goalPicked = Array.isArray(stored) ? stored.filter((k) => typeof k === "string" && k) : [];
}
function saveGoalFilters() { try { localStorage.setItem("tbp-goal-filter", JSON.stringify(goalPicked)); } catch {} }
const goalKey = (t) => t.goal || NO_GOAL;
const passesGoal = (t) => !goalPicked.length || goalPicked.includes(goalKey(t));
function renderGoalFilters() {
  const list = visible();
  // One button per goal with tickets, newest first, plus any picked goal no ticket has any more, so it can be unpicked.
  const ids = [...new Set([...tickets.map((t) => t.goal).filter(Boolean), ...goalPicked.filter((k) => k !== NO_GOAL)])]
    .sort((a, b) => idNum(b) - idNum(a));
  const button = (key, name, title) => `<button data-goal="${esc(key)}" aria-pressed="${goalPicked.includes(key)}"${title ? ` title="${esc(title)}"` : ""}>${esc(name)}<span class="n">${list.filter((t) => goalKey(t) === key).length}</span></button>`;
  $("goal-filters").hidden = !ids.length;
  $("goal-filters").innerHTML = '<span class="label">Goal</span>'
    + `<button data-goal="" aria-pressed="${!goalPicked.length}">Any<span class="n">${list.length}</span></button>`
    + ids.map((id) => button(id, id, goalById(id)?.title || "")).join("") + button(NO_GOAL, "No goal");
}
const orderedLanes = () => colOrder.map((k) => LANES.find((l) => l.key === k));
const areaOf = (t) => AREAS.find((a) => a.epics.includes(t.epic));
const mvpOnly = () => $("mvp-only").checked;
const visible = () => tickets.filter((t) => !mvpOnly() || t.milestone === "mvp");
const idNum = (id) => parseInt(String(id).replace(/\D/g, ""), 10) || 0;

// Dependencies: built from each task's depends_on field.
let index = new Map();     // id -> ticket
let dependents = new Map(); // id -> tickets that list it in depends_on
const closed = (s) => s === "done" || s === "cancelled";
function buildIndex() {
  index = new Map(tickets.map((t) => [t.id, t]));
  dependents = new Map();
  tickets.forEach((t) => (t.depends_on || []).forEach((d) => {
    if (!dependents.has(d)) dependents.set(d, []);
    dependents.get(d).push(t);
  }));
}
const depsOf = (t) => (t.depends_on || []).map((id) => index.get(id) || { id, title: "Not found", status: "open", missing: true });
const waitingOn = (t) => depsOf(t).filter((d) => !closed(d.status));
const blocksOf = (t) => dependents.get(t.id) || [];
// Everything further down the chain that is still open: what finishing this ticket helps unblock.
function downstream(t) {
  const seen = new Set(), queue = [t.id];
  while (queue.length) {
    for (const d of dependents.get(queue.shift()) || []) {
      if (seen.has(d.id) || closed(d.status)) continue;
      seen.add(d.id); queue.push(d.id);
    }
  }
  return seen.size;
}
// ready: open and nothing to wait for. waits: something it depends on is unfinished.
// check: the file says blocked, but everything it depends on is finished.
function readiness(t) {
  if (!["open", "blocked"].includes(t.status)) return null;
  const w = waitingOn(t).length;
  if (w) return "waits";
  return t.status === "blocked" ? "check" : "ready";
}
const needsYou = (t) => t.status === "planning" || t.status === "needs-playtest" || t.status === "flagged-for-review" || (t.to === "board" && !closed(t.status));
const statusColor = (s) => s === "blocked" ? "#b7bcf0" : laneOf(s).color;

// "Changed" folder: statuses you have seen, kept in this browser only.
let seen = {};
// What the board has seen of a ticket: its status and how many Project Lead updates it had.
const updCount = (t) => (t.updates || []).length;
const sigOf = (t) => `${t.status}|${updCount(t)}`;
function loadSeen() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("tbp-seen") || "null"); } catch {}
  if (stored && typeof stored === "object") { seen = stored; return; }
  // First visit: everything counts as seen except what needs you.
  seen = {};
  tickets.forEach((t) => { if (!needsYou(t)) seen[t.id] = sigOf(t); });
  saveSeen();
}
function saveSeen() { try { localStorage.setItem("tbp-seen", JSON.stringify(seen)); } catch {} }
// Unread: its status changed, or a Project Lead update was posted, since it was last opened.
// (A value saved by an older page is just a status: compare that alone.)
function isUnread(t) {
  const s = seen[t.id];
  if (s === undefined) return true;
  return String(s).includes("|") ? s !== sigOf(t) : s !== t.status;
}
function markSeen(t) { if (isUnread(t)) { seen[t.id] = sigOf(t); saveSeen(); return true; } return false; }

function badges(t) {
  const out = [];
  const r = readiness(t);
  const w = r === "waits" ? waitingOn(t).length : 0;
  if (t.status === "blocked") out.push(`<span class="chip blocked">${r === "waits" ? `Waits on ${w}` : "Blocked"}</span>`);
  if (r === "check") out.push('<span class="chip check" title="Marked blocked, but everything it depends on is done">Can start?</span>');
  if (r === "ready") out.push('<span class="chip ready">Ready</span>');
  if (r === "waits" && t.status === "open") out.push(`<span class="chip waits">Waits on ${w}</span>`);
  if (t.status === "needs-playtest") out.push('<span class="chip playtest">Playtest</span>');
  if (t.status === "flagged-for-review") out.push('<span class="chip flagged">Flagged</span>');
  if (t.status === "cancelled") out.push('<span class="chip cancelled">Cancelled</span>');
  if (t.milestone && t.milestone !== "mvp") out.push('<span class="chip later">After MVP</span>');
  if (t.file_status && t.status !== t.file_status) out.push('<span class="chip moved" title="Moved here on the board; not yet applied to the task file">Moved</span>');
  return out.join("");
}

function renderBoard() {
  const list = visible().filter(passesFilter).filter(passesOwner).filter(passesGoal);
  $("reset-cols").hidden = colOrder.join() === DEFAULT_ORDER.join();
  renderFilters();
  $("board").innerHTML = orderedLanes().map((lane) => {
    // The board's own tickets come first in every lane, with a big label.
    const mine = (t) => t.to === "board";
    const items = list.filter((t) => laneOf(t.status).key === lane.key)
      .sort((a, b) => (mine(b) - mine(a)) || (idNum(a.id) - idNum(b.id)));
    const cards = items.map((t) => `
      <article class="card${t.status === "cancelled" ? " is-cancelled" : ""}${mine(t) ? " is-mine" : ""}${isUnread(t) ? " is-new" : ""}" tabindex="0" data-id="${esc(t.id)}" style="--c:${lane.color}" aria-label="${esc(t.id)} ${esc(t.title)}${mine(t) ? ", your ticket" : ""}${isUnread(t) ? ", changed since you last opened it" : ""}">
        ${mine(t) ? '<div class="mine-label">Your ticket</div>' : ""}
        <div class="row"><span class="id">${esc(t.id)}</span>${isUnread(t) ? '<span class="chip new" title="Changed since you last opened it">New</span>' : ""}${badges(t)}${shotsChip(t)}${t.lead ? `<span class="chip owner" title="Owned by the Project Lead session ${esc(t.lead)}">${esc(t.lead)}</span>` : ""}${goalTag(t)}<span class="chip agent">${esc(AGENTS[t.to] || t.to)}</span></div>
        <div class="title">${esc(t.title)}</div>
      </article>`).join("");
    return `<section class="lane" data-lane="${lane.key}" style="--c:${lane.color}">
      <h2 title="Drag to move this column"><span class="dot"></span>${lane.name}<span class="n">${items.length}</span></h2>
      <div class="cards">${cards || '<div class="empty-lane">Nothing here.</div>'}</div>
    </section>`;
  }).join("");
}

function areaStats(area) {
  const items = visible().filter((t) => area.epics.includes(t.epic) && t.status !== "cancelled");
  const done = items.filter((t) => t.status === "done").length;
  return { items, done, pct: items.length ? Math.round((done / items.length) * 100) : 0 };
}

function renderAreas() {
  const counted = visible().filter((t) => { const a = areaOf(t); return a && !a.excluded && t.status !== "cancelled"; });
  const done = counted.filter((t) => t.status === "done").length;
  const pct = counted.length ? Math.round((done / counted.length) * 100) : 0;
  const empty = AREAS.filter((a) => !a.excluded && areaStats(a).items.length === 0).map((a) => a.name);
  $("summary").innerHTML = `
    <div><div class="big">${pct}<span>%</span></div><div class="big-label">${mvpOnly() ? "MVP" : "All"} tickets done</div></div>
    <div style="min-width:0">
      <div class="meter"><i style="width:${pct}%"></i></div>
      <p class="caveat">${done} of ${counted.length} game tickets are done (tooling not counted).
      <strong>This only counts tickets that exist.</strong> The task board does not cover the whole MVP yet${empty.length ? `: ${empty.join(", ")} ${empty.length === 1 ? "has" : "have"} no tickets at all` : ""}. The figure means more once every game area doc has its MVP tickets.</p>
    </div>`;
  const max = Math.max(1, ...AREAS.map((a) => areaStats(a).items.length));
  $("bubbles").innerHTML = AREAS.map((a, i) => {
    const s = areaStats(a);
    const d = Math.round(130 + 110 * Math.sqrt(s.items.length / max));
    const cls = ["bubble", s.items.length ? "" : "none", a.excluded ? "excluded" : ""].join(" ");
    const sub = s.items.length ? `${s.done} of ${s.items.length} done` : "No tickets yet";
    return `<button class="${cls}" data-area="${i}" style="--d:${d}px;--c:${a.color};--p:${s.pct}%" aria-label="${esc(a.name)}: ${sub}">
      <span class="fill"></span>
      <span class="txt"><span class="name">${esc(a.name)}</span>
      <span class="pct">${s.items.length ? s.pct + "%" : "–"}</span>
      <span class="sub">${sub}${a.excluded ? " · not counted" : ""}</span></span>
    </button>`;
  }).join("");
}

function renderOverlay() {
  if (openArea === null) { $("overlay").hidden = true; return; }
  const a = AREAS[openArea];
  const s = areaStats(a);
  const n = s.items.length;
  const floaters = s.items.sort((x, y) => idNum(x.id) - idNum(y.id)).map((t, i) => {
    // Golden-angle spiral keeps the tickets spread evenly inside the circle.
    const r = n === 1 ? 0 : 34 * Math.sqrt((i + 0.6) / n);
    const ang = i * 2.39996;
    const x = 50 + r * Math.cos(ang), y = 50 + r * Math.sin(ang);
    const lane = laneOf(t.status);
    return `<div class="floater" style="left:${x}%;top:${y}%;--t:${(3 + (i % 5) * 0.7).toFixed(1)}s;--delay:-${(i * 0.9) % 4}s">
      <button data-id="${esc(t.id)}" style="--c:${lane.color}"><span class="id">${esc(t.id)}</span><span class="t">${esc(t.title)}</span></button></div>`;
  }).join("");
  const count = (key) => s.items.filter((t) => laneOf(t.status).key === key).length;
  $("overlay").innerHTML = `
    <div class="area-panel" role="dialog" aria-modal="true" aria-labelledby="area-title" style="--c:${a.color}">
      <div class="area-head">
        <div><h2 id="area-title">${esc(a.name)}</h2>
        <p>${a.doc ? `Game area doc: docs/${esc(a.doc)}` : "No game area doc"}${a.excluded ? " · not counted in the MVP figure" : ""} · ${n ? `${s.pct}% done` : "no tickets yet"}</p></div>
        <button class="close" id="area-close">Close</button>
      </div>
      <div class="sphere" style="--p:${s.pct}%"><span class="fill"></span>
        ${floaters || `<div class="nothing">No ${mvpOnly() ? "MVP " : ""}tickets for this area yet.</div>`}
      </div>
      <div class="side">
        <h3>Progress</h3>
        <div class="counts">${LANES.map((l) => `<div style="--c:${l.color}"><b>${count(l.key)}</b><small>${l.name}</small></div>`).join("")}</div>
        <h3>Tickets</h3>
        <ul>${s.items.map((t) => { const l = laneOf(t.status); return `<li style="--c:${l.color}"><span class="id">${esc(t.id)}</span><span>${esc(t.title)}</span><span class="s">${STATUS_TEXT[t.status] || t.status}</span></li>`; }).join("") || "<li>None yet.</li>"}</ul>
      </div>
    </div>`;
  $("overlay").hidden = false;
}

// Inbox
const FOLDERS = [
  { key: "you", name: "Needs you", color: "var(--pink)", test: needsYou,
    blurb: "Tickets you are refining with the Project Lead, playtests waiting for you, tasks flagged after two failed QA rounds, and tickets assigned to you." },
  { key: "ready", name: "Ready to start", color: "var(--done)", test: (t) => readiness(t) === "ready" && !needsYou(t),
    blurb: "Open, with everything they depend on finished. The ones that unblock the most come first." },
  { key: "moving", name: "In progress", color: "var(--qa)", test: (t) => t.status === "in-progress" || t.status === "in-qa",
    blurb: "An agent or QA is working on these on their task branches." },
  { key: "waiting", name: "Waiting", color: "#b7bcf0", test: (t) => (readiness(t) === "waits" || readiness(t) === "check") && !needsYou(t),
    blurb: "Waiting on other tickets. “Can start?” means the file says blocked, but everything it depends on is finished." },
  { key: "changed", name: "Changed", color: "var(--cyan)", test: isUnread,
    blurb: "Status changed, or the Project Lead posted an update, since you last opened the ticket. Remembered in this browser only." },
  { key: "all", name: "All open", color: "var(--muted)", test: (t) => !closed(t.status),
    blurb: "Every ticket that isn't done or cancelled." },
];
let folder = "you";
let agentFilter = null;
const agentName = (key) => AGENTS[key] || key;

function why(t) {
  const r = readiness(t);
  const list = (arr) => arr.map((d) => `<b>${esc(d.id)}</b> (${esc(STATUS_TEXT[d.status] || d.status)})`).join(", ");
  if (t.status === "needs-playtest") return t.review ? `QA passed. Your review: ${esc(t.review)}` : "QA passed. Waiting for your playtest.";
  if (t.status === "flagged-for-review") return "Failed QA twice. Needs your call.";
  if (t.status === "planning") return "Being refined with the Project Lead: open questions first, then In progress.";
  if (t.to === "board" && !closed(t.status)) return `Assigned to you · ${esc(STATUS_TEXT[t.status] || t.status)}.`;
  if (t.status === "in-progress") return t.folder ? `Being worked on in <b>${esc(t.folder)}</b>.` : "Being worked on.";
  if (t.status === "in-qa") return `QA is checking it${t.qa_rounds ? ` (round ${t.qa_rounds + 1})` : ""}.`;
  if (r === "check") return `Marked blocked, but everything it depends on is finished: ${list(depsOf(t))}.`;
  if (r === "waits") return `Waiting on ${list(waitingOn(t))}.`;
  if (r === "ready") {
    const n = downstream(t);
    return `${(t.depends_on || []).length ? "Everything it depends on is done." : "No dependencies."}${n ? ` Finishing it unblocks <b>${n}</b>.` : ""}`;
  }
  return esc(STATUS_TEXT[t.status] || t.status) + ".";
}

function folderItems(key) {
  const f = FOLDERS.find((x) => x.key === key);
  let items = visible().filter(f.test);
  if (agentFilter) items = items.filter((t) => t.to === agentFilter);
  if (key === "ready") return items.sort((a, b) => downstream(b) - downstream(a) || idNum(a.id) - idNum(b.id));
  if (key === "waiting") return items.sort((a, b) => (readiness(b) === "check") - (readiness(a) === "check") || waitingOn(a).length - waitingOn(b).length || idNum(a.id) - idNum(b.id));
  return items.sort((a, b) => idNum(a.id) - idNum(b.id));
}

function renderInbox() {
  $("folders").innerHTML = FOLDERS.map((f) => {
    const n = folderItems(f.key).length;
    return `<button type="button" data-folder="${f.key}" aria-pressed="${f.key === folder}" style="--c:${f.color}"><span class="dot"></span>${f.name}<span class="n">${n}</span></button>`;
  }).join("");
  const f = FOLDERS.find((x) => x.key === folder);
  const items = folderItems(folder);
  const actions = [];
  if (agentFilter) actions.push(`<button type="button" data-act="clear-agent">Show all agents</button>`);
  if (folder === "changed" && items.length) actions.push(`<button type="button" data-act="seen-all">Mark all as seen</button>`);
  $("inbox-head").innerHTML = `<h2>${f.name}${agentFilter ? ` · ${esc(agentName(agentFilter))}` : ""}</h2><p>${f.blurb}</p>${actions.join("")}`;
  $("rows").innerHTML = items.length ? items.map((t) => {
    const unread = isUnread(t);
    return `<button type="button" class="irow${unread ? " is-unread" : ""}" data-id="${esc(t.id)}" style="--c:${statusColor(t.status)}" aria-label="${esc(t.id)} ${esc(t.title)}${unread ? ", changed" : ""}">
      <span class="unread"></span><span class="id">${esc(t.id)}</span>
      <span class="body"><span class="t">${esc(t.title)}</span><span class="why">${why(t)}</span></span>
      <span class="tags"><span class="chip">${esc(agentName(t.to))}</span><span class="chip" style="color:${statusColor(t.status)}">${esc(STATUS_TEXT[t.status] || t.status)}</span></span>
    </button>`;
  }).join("") : `<div class="empty-inbox">${folder === "you" ? "Nothing is waiting on you." : "Nothing here."}</div>`;
}

function renderOverview() {
  const list = visible();
  const you = list.filter(needsYou);
  const ready = list.filter(FOLDERS[1].test).sort((a, b) => downstream(b) - downstream(a));
  const moving = list.filter(FOLDERS[2].test);
  const waiting = list.filter(FOLDERS[3].test);
  const canStart = waiting.filter((t) => readiness(t) === "check").length;
  const counted = list.filter((t) => t.status !== "cancelled");
  const done = counted.filter((t) => t.status === "done").length;
  const pct = counted.length ? Math.round((done / counted.length) * 100) : 0;
  const tile = (key, color, label, value, sub, hot) => `<button type="button" class="tile${hot ? " is-hot" : ""}" data-folder="${key}" style="--c:${color}">
    <span class="k">${label}</span><span class="v">${value}</span><span class="s">${sub}</span></button>`;
  $("overview").innerHTML = [
    tile("you", "var(--pink)", "Needs you", you.length, you.length ? `${esc(you[0].id)} ${esc(you[0].title)}` : "Nothing waiting", you.length > 0),
    tile("ready", "var(--done)", "Ready to start", ready.length, !ready.length ? "Nothing ready" : downstream(ready[0]) ? `${esc(ready[0].id)} unblocks ${downstream(ready[0])}` : `${esc(ready[0].id)} ${esc(ready[0].title)}`, false),
    tile("moving", "var(--qa)", "In progress", moving.length, moving.length ? [...new Set(moving.map((t) => agentName(t.to)))].join(", ") : "No agent working", false),
    tile("waiting", "#b7bcf0", "Waiting", waiting.length, canStart ? `${canStart} marked blocked could start` : "On other tickets", canStart > 0),
    `<button type="button" class="tile" data-view="areas" style="--c:var(--done)"><span class="k">Done</span><span class="v">${done}<small>/ ${counted.length}</small></span><span class="meter"><i style="width:${pct}%"></i></span></button>`,
  ].join("");
  // Open work by agent: ready, in progress, waiting.
  const open = list.filter((t) => !closed(t.status) && t.to !== "board");
  const agents = [...new Set(open.map((t) => t.to))].sort((a, b) => open.filter((t) => t.to === b).length - open.filter((t) => t.to === a).length);
  $("loadrow").innerHTML = agents.length ? `<span class="lbl">Open work by agent</span>` + agents.map((a) => {
    const mine = open.filter((t) => t.to === a);
    const seg = (count, color) => count ? `<i style="width:${count * 6}px;background:${color}"></i>` : "";
    const r = mine.filter((t) => readiness(t) === "ready").length;
    const m = mine.filter((t) => ["in-progress", "in-qa", "needs-playtest", "flagged-for-review"].includes(t.status)).length;
    const w = mine.length - r - m;
    return `<button type="button" class="load" data-agent="${esc(a)}" title="${r} ready, ${m} in progress, ${w} waiting"><b>${esc(agentName(a))}</b><span class="bar">${seg(m, "var(--qa)")}${seg(r, "var(--done)")}${seg(w, "#4a5196")}</span><span class="n">${mine.length}</span></button>`;
  }).join("") : "";
}

function renderSync() {
  const when = lastRead ? lastRead.toLocaleTimeString(undefined, { timeStyle: "medium" }) : null;
  $("syncline").innerHTML = !loaded ? "Loading tickets…"
    : serverDown ? `<span class="down">The board server isn't answering. Start it with: python tools/taskboard/server.py</span>`
    : `<span>${tickets.length} tickets from tasks/ and the open task branches</span><span class="live">● Live${when ? ` · read ${esc(when)}` : ""}</span>`;
}

function render() {
  renderSync();
  if (loaded && !tickets.length) {
    $("notice").hidden = false;
    $("notice").textContent = serverDown ? "The board server isn't running, so there are no tickets to show." : "No task files found in tasks/.";
  } else $("notice").hidden = true;
  renderOverview();
  renderInbox();
  renderBoard();
  renderAreas();
  renderOverlay();
}

// Builds: master and every worktree, with buttons that start Godot through the local server.

async function launchBuild(id, mode) {
  try {
    const res = await fetch("/api/launch", { method: "POST", headers: { "Content-Type": "application/json", "X-Board": "1" },
      body: JSON.stringify({ id, mode }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "The board server refused to start Godot.");
    buildMsg = "";
    toast(mode === "play" ? "Starting the game…" : "Opening the Godot editor…");
  } catch (e) {
    buildMsg = String(e.message || e);
    toast(buildMsg, 7000);
  }
  renderBuilds();
}
function renderDetailBuild(t) {
  const b = buildOf(t), el = $("detail-build");
  el.hidden = !b;
  if (!b) return;
  el.innerHTML = `<button type="button" data-launch="play" data-id="${esc(b.id)}">Play this build</button>
    <a href="#" data-goto="${esc(b.id)}">Show in Builds</a>`;
}
$("builds").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-launch]");
  if (b && !b.disabled) launchBuild(b.dataset.id, b.dataset.launch);
});
$("detail-build").addEventListener("click", (e) => {

// A move goes to the local server, which runs the status script: the task file changes, or the move is refused with a reason.
let lastMoveError = "";
async function moveTicket(id, laneKey, note = "", statusOverride = null) {
  lastMoveError = "";
  const t = tickets.find((x) => x.id === id);
  const lane = LANES.find((l) => l.key === laneKey);
  if (!t || (!statusOverride && (!lane || laneOf(t.status).key === laneKey))) return false;
  const status = statusOverride || lane.target;
  const before = t.status;
  t.status = status;
  render();
  try {
    const res = await fetch("/api/move", { method: "POST", headers: { "Content-Type": "application/json", "X-Board": "1" },
      body: JSON.stringify({ id, status, note }) });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || "The board server refused the move.");
    markSeen(t);

    await refresh(true);
    return true;
  } catch (e) {
    t.status = before; render();
    lastMoveError = String(e.message || e).replace(/^Refused\. /, "");

}, { passive: false });
function endDrag(e, cancelled) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  clearTimeout(drag.timer);
  const d = drag; drag = null;
  document.querySelectorAll(".lane.over").forEach((l) => l.classList.remove("over"));
  if (!d.started) { if (!cancelled) openDetail(d.id); return; }
  d.ghost.remove();
  d.card.classList.remove("dragging");
  const lane = !cancelled && laneAt(e.clientX, e.clientY);
  if (lane) askMoveNote(d.id, lane.dataset.lane);
}

// A drop on another column asks for an optional note first; the move happens only on Move / Enter.
let pendingMove = null;
function askMoveNote(id, laneKey) {
  const t = tickets.find((x) => x.id === id);
  const to = LANES.find((l) => l.key === laneKey);
  if (!t || !to || laneOf(t.status).key === laneKey) return;
  pendingMove = { id, laneKey };
  $("move-id").textContent = id;
  $("move-title").textContent = t.title || "";
  $("move-route").textContent = `From ${laneOf(t.status).name} to ${to.name}`;
  $("move-note").value = "";
  $("move-error").hidden = true; $("move-error").textContent = "";
  $("movenote").showModal();
  $("move-note").focus();
}
async function confirmMove() {
  if (!pendingMove || $("move-go").disabled) return;
  const { id, laneKey } = pendingMove;
  $("move-go").disabled = true;
  const ok = await moveTicket(id, laneKey, $("move-note").value.trim());
  $("move-go").disabled = false;
  if (ok) { pendingMove = null; $("movenote").close(); return; }
  $("move-error").textContent = lastMoveError || "The move did not happen.";
  $("move-error").hidden = false;
  $("move-note").focus();
}
$("move-go").addEventListener("click", confirmMove);
$("move-cancel").addEventListener("click", () => $("movenote").close());
$("movenote").addEventListener("close", () => { pendingMove = null; });
$("move-note").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); confirmMove(); }
});
document.addEventListener("pointerup", (e) => endDrag(e, false));
document.addEventListener("pointercancel", (e) => endDrag(e, true));
document.addEventListener("touchmove", (e) => { if (drag?.started) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (e) => { if (drag?.touch) e.preventDefault(); });

// Dragging a column by its header to reorder the columns. Kept apart from the card drag above:
// it starts only on a header (never on a card) and drops only change the order, never a status.
let colDrag = null;
document.addEventListener("pointerdown", (e) => {
  const head = e.target.closest(".lane > h2");
  if (!head || e.button > 0 || drag) return;
  const lane = head.closest(".lane");
  colDrag = { lane, key: lane.dataset.lane, x: e.clientX, y: e.clientY, pid: e.pointerId, started: false,
              touch: e.pointerType !== "mouse", ready: e.pointerType === "mouse" };
  if (colDrag.touch) colDrag.timer = setTimeout(() => { if (colDrag) { colDrag.ready = true; startColDrag(); } }, 280);
});
function startColDrag() {
  colDrag.started = true;
  colDrag.lane.classList.add("col-dragging");
  try { colDrag.lane.querySelector("h2").setPointerCapture(colDrag.pid); } catch {}
}
function markColTarget(x, y) {
  document.querySelectorAll(".lane.col-over").forEach((l) => l.classList.remove("col-over"));
  const lane = laneAt(x, y);
  if (lane && lane !== colDrag.lane) lane.classList.add("col-over");
  return lane;
}
document.addEventListener("pointermove", (e) => {
  if (!colDrag || e.pointerId !== colDrag.pid) return;
  if (!colDrag.started) {
    const dist = Math.hypot(e.clientX - colDrag.x, e.clientY - colDrag.y);
    if (colDrag.touch && !colDrag.ready && dist > 8) { clearTimeout(colDrag.timer); colDrag = null; return; }
    if (colDrag.ready && dist > 5) startColDrag();
    return;
  }
  e.preventDefault();
  markColTarget(e.clientX, e.clientY);
}, { passive: false });
function endColDrag(e, cancelled) {
  if (!colDrag || (e && e.pointerId !== colDrag.pid)) return;
  clearTimeout(colDrag.timer);
  const d = colDrag; colDrag = null;
  document.querySelectorAll(".lane.col-over").forEach((l) => l.classList.remove("col-over"));
  d.lane.classList.remove("col-dragging");
  if (!d.started || cancelled) return;
  const target = laneAt(e.clientX, e.clientY);
  if (!target || target.dataset.lane === d.key) return;
  // The dragged column takes the target column's place; the others shift along.
  const keys = colOrder.filter((k) => k !== d.key);
  keys.splice(colOrder.indexOf(target.dataset.lane), 0, d.key);
  saveColOrder(keys);
  renderBoard();
}
document.addEventListener("pointerup", (e) => endColDrag(e, false));
document.addEventListener("pointercancel", (e) => endColDrag(e, true));
document.addEventListener("touchmove", (e) => { if (colDrag?.started) e.preventDefault(); }, { passive: false });
$("reset-cols").addEventListener("click", () => { saveColOrder(DEFAULT_ORDER); renderBoard(); });
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-filter]");
  if (!b) return;
  const key = b.dataset.filter;
  picked = !key ? [] : picked.includes(key) ? picked.filter((k) => k !== key) : [...picked, key];
  saveFilters();
  renderBoard();
});
$("owner-filters").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-owner]");
  if (!b) return;
  const key = b.dataset.owner;
  ownerPicked = !key ? [] : ownerPicked.includes(key) ? ownerPicked.filter((k) => k !== key) : [...ownerPicked, key];
  saveOwnerFilters();
  renderBoard();
});

document.addEventListener("keydown", (e) => {
  const card = e.target.closest?.(".card");
  if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDetail(card.dataset.id); }
  if (e.key === "Escape" && openArea !== null && !$("detail").open) { openArea = null; renderOverlay(); }
});

// View switching and other controls
const VIEWS = ["board", "inbox", "areas", "builds"];
function showView(which) {
  VIEWS.forEach((v) => {
    $(`tab-${v}`).setAttribute("aria-selected", v === which);
    $(`view-${v}`).hidden = v !== which;
  });
  try { localStorage.setItem("tbp-view", which); } catch {}
}
VIEWS.forEach((v) => $(`tab-${v}`).addEventListener("click", () => showView(v)));
function openFolder(key, agent = null) {
  folder = key; agentFilter = agent;
  renderInbox(); showView("inbox");
}
$("overview").addEventListener("click", (e) => {
  const b = e.target.closest(".tile"); if (!b) return;
  if (b.dataset.view) showView(b.dataset.view); else openFolder(b.dataset.folder);
});
$("loadrow").addEventListener("click", (e) => { const b = e.target.closest(".load"); if (b) openFolder("all", b.dataset.agent); });
$("folders").addEventListener("click", (e) => { const b = e.target.closest("button[data-folder]"); if (b) { folder = b.dataset.folder; renderInbox(); } });
$("inbox-head").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  if (b.dataset.act === "clear-agent") agentFilter = null;
  if (b.dataset.act === "seen-all") { folderItems("changed").forEach((t) => { seen[t.id] = sigOf(t); }); saveSeen(); renderBoard(); renderOverview(); }
  renderInbox();
});
$("rows").addEventListener("click", (e) => { const b = e.target.closest(".irow"); if (b) openDetail(b.dataset.id); });
$("mvp-only").addEventListener("change", () => { render(); try { localStorage.setItem("tb-mvp", $("mvp-only").checked ? "1" : "0"); } catch {} });
$("bubbles").addEventListener("click", (e) => { const b = e.target.closest(".bubble"); if (b) { openArea = +b.dataset.area; renderOverlay(); $("area-close")?.focus(); } });
$("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay" || e.target.id === "area-close") { openArea = null; renderOverlay(); return; }
  const f = e.target.closest(".floater button"); if (f) openDetail(f.dataset.id);
});
$("detail-close").addEventListener("click", () => $("detail").close());
$("detail").addEventListener("click", (e) => { if (e.target === $("detail")) $("detail").close(); });
$("detail-move").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-lane]");
  if (!b || !detailId) return;
  if (await moveTicket(detailId, b.dataset.lane, $("detail-note").value.trim())) { $("detail-note").value = ""; $("detail").close(); }
});
$("detail-cancel").addEventListener("click", async () => {
  if (!detailId) return;
  const note = $("detail-note").value.trim();
  if (!note) { toast("Write why in the note first: a cancelled task keeps a note saying why.", 5000); $("detail-note").focus(); return; }
  if (await moveTicket(detailId, null, note, "cancelled")) { $("detail-note").value = ""; $("detail").close(); }
});
loadColOrder();
loadFilters();
loadOwnerFilters();
loadGoalFilters();
loadGoalFold();
try {
  const v = localStorage.getItem("tbp-view");
  if (VIEWS.includes(v)) showView(v);
  if (localStorage.getItem("tb-mvp") === "0") $("mvp-only").checked = false;
} catch {}

render();

// Live data: the local server reads the task files on every request. The page checks for changes every 2 seconds.
async function refresh(force = false) {
  try {
    if (!force) {
      const v = await (await fetch("/api/version", { cache: "no-store" })).json();
      if (v.version === version && !serverDown) return;
    }
    const data = await (await fetch("/api/tickets", { cache: "no-store" })).json();
    tickets = data.tickets || [];
    version = data.version;
    lastRead = new Date();
    serverDown = false;
    buildIndex();
    if (!seenLoaded) { loadSeen(); seenLoaded = true; }
    await refreshGoals();   // same version check as the tickets; the strip redraws only if the goals changed
  } catch {
    serverDown = true;
  }
  loaded = true;
  render();
  if (detailId && $("detail").open && tickets.some((t) => t.id === detailId)) openDetail(detailId);
}
refresh(true);
refreshBuilds();
setInterval(() => { if (!drag?.started && !colDrag?.started) { refresh(); refreshBuilds(); } }, 2000);
</script>
</body>
</html>
